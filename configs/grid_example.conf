# Electric fields may be comma- or whitespace-separated.
fields_v_cm = 500, 1000
electron_energy_ev = 1.0
cutoff_s = 1e-6
write_every = 100
batches = 10

# Grid jobs derive independent deterministic streams from this seed and $PROCESS.
seed = 123456
cores = 1

# These can be overridden by the worker wrapper.
output_dir = output
output_prefix = translate_

# Optional diagnostic output.
debug = 0
status = 0
